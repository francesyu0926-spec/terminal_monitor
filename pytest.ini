[pytest]
pythonpath = .
testpaths = api_tests/testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    smoke: 冒烟用例，优先在 CI 中执行
    regression: 回归用例
    health: 健康检查相关
    terminal: 终端监控业务接口
    auth: 登录与 token
    quote: 行情接口（/quotes/api 与 desk/quotes/api，默认仅 9:30–23:39 上海时区执行）
    rest: 资讯等 /terminal/rest 接口
    zxt_web: /terminal/zxt-web 业务接口
    desk: 桌面行情页 /terminal/desk
    zxt_desktop: zxt.sfccn.com 桌面 HTML 页
